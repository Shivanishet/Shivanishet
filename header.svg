<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&amp;family=Poppins:wght@400;500&amp;display=swap');
      .name { font-family: 'Great Vibes', cursive; }
      .sub { font-family: 'Poppins', 'Segoe UI', sans-serif; }
    </style>

    <radialGradient id="bgGrad" cx="50%" cy="50%" r="90%">
      <stop offset="0%" stop-color="#1f2937">
        <animate attributeName="stop-color"
          values="#1f2937;#0f172a;#1e1b4b;#3b0764;#0f172a;#1f2937"
          dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#020617" />
      <animate attributeName="cx" values="50%;70%;40%;50%" dur="12s" repeatCount="indefinite" />
      <animate attributeName="cy" values="30%;70%;40%;30%" dur="14s" repeatCount="indefinite" />
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e9d5ff" />
      <stop offset="100%" stop-color="#a5b4fc" />
    </linearGradient>

    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#8A63FF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- animated dark background -->
  <rect width="900" height="260" fill="url(#bgGrad)" />

  <!-- diagonal shimmer sweep -->
  <rect x="-300" y="0" width="300" height="260" fill="url(#shimmer)" transform="skewX(-20)">
    <animateTransform attributeName="transform" type="translate"
      values="-300 0; 1200 0" dur="6s" repeatCount="indefinite" additive="sum" />
  </rect>

  <!-- drifting particles -->
  <g fill="#ffffff">
    <circle cx="120" cy="30" r="1.3" opacity="0.3">
      <animate attributeName="cy" values="30;230;30" dur="9s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="830" cy="200" r="1.4" opacity="0.25">
      <animate attributeName="cy" values="200;20;200" dur="11s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="20" r="1.2" opacity="0.3">
      <animate attributeName="cy" values="20;240;20" dur="13s" repeatCount="indefinite" />
    </circle>
    <circle cx="700" cy="60" r="1.5" opacity="0.25">
      <animate attributeName="cy" values="60;230;60" dur="7.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="500" cy="220" r="1.3" opacity="0.3">
      <animate attributeName="cy" values="220;20;220" dur="10s" repeatCount="indefinite" />
    </circle>
    <circle cx="200" cy="100" r="1.1" opacity="0.25">
      <animate attributeName="cx" values="200;240;200" dur="8s" repeatCount="indefinite" />
      <animate attributeName="cy" values="100;40;100" dur="9.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="780" cy="100" r="1.1" opacity="0.25">
      <animate attributeName="cx" values="780;740;780" dur="8s" repeatCount="indefinite" />
      <animate attributeName="cy" values="100;40;100" dur="9.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- gentle moving wave band near the bottom -->
  <path fill="#0F0C29" opacity="0.5">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="
        M0,245 C225,230 675,260 900,245 L900,260 L0,260 Z;
        M0,250 C225,265 675,235 900,250 L900,260 L0,260 Z;
        M0,245 C225,230 675,260 900,245 L900,260 L0,260 Z" />
  </path>

  <!-- name text, cursive font, letters fade in one by one, single line, centered -->
  <text x="450" y="150" text-anchor="middle" class="name" font-size="64" fill="url(#textGrad)">
    <tspan opacity="0">S<animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.5s" fill="freeze" /></tspan><tspan opacity="0">h<animate attributeName="opacity" from="0" to="1" begin="0.22s" dur="0.5s" fill="freeze" /></tspan><tspan opacity="0">i<animate attributeName="opacity" from="0" to="1" begin="0.34s" dur="0.5s" fill="freeze" /></tspan><tspan opacity="0">v<animate attributeName="opacity" from="0" to="1" begin="0.46s" dur="0.5s" fill="freeze" /></tspan><tspan opacity="0">a<animate attributeName="opacity" from="0" to="1" begin="0.58s" dur="0.5s" fill="freeze" /></tspan><tspan opacity="0">n<animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.5s" fill="freeze" /></tspan><tspan opacity="0">i<animate attributeName="opacity" from="0" to="1" begin="0.82s" dur="0.5s" fill="freeze" /></tspan><tspan opacity="0"> <animate attributeName="opacity" from="0" to="1" begin="0.94s" dur="0.5s" fill="freeze" /></tspan><tspan opacity="0">S<animate attributeName="opacity" from="0" to="1" begin="1.05s" dur="0.5s" fill="freeze" /></tspan><tspan opacity="0">h<animate attributeName="opacity" from="0" to="1" begin="1.17s" dur="0.5s" fill="freeze" /></tspan><tspan opacity="0">e<animate attributeName="opacity" from="0" to="1" begin="1.29s" dur="0.5s" fill="freeze" /></tspan><tspan opacity="0">t<animate attributeName="opacity" from="0" to="1" begin="1.41s" dur="0.5s" fill="freeze" /></tspan>
  </text>

  <!-- quote line, fades in after name, centered -->
  <text x="450" y="200" text-anchor="middle" class="sub" font-size="14" font-style="italic" fill="#c4b5fd" opacity="0">
    "First, solve the problem. Then, write the code."
    <animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="1.2s" fill="freeze" />
  </text>
</svg>
