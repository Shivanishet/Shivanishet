<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0718"/>
      <stop offset="45%" stop-color="#1a1030"/>
      <stop offset="100%" stop-color="#2a1a4a"/>
    </linearGradient>

    <radialGradient id="orbPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8A63FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8A63FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c15bff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#c15bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5b9dff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#5b9dff" stop-opacity="0"/>
    </radialGradient>

    <filter id="blurBig" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="blurSmall" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d9c8ff"/>
    </linearGradient>

    <!-- Flat-top / inward-curving-bottom panel shape -->
    <clipPath id="wavePanel">
      <path d="M0,0 L1200,0 L1200,230 Q600,150 0,230 Z"/>
    </clipPath>
    <path id="wavePanelShape" d="M0,0 L1200,0 L1200,230 Q600,150 0,230 Z"/>
  </defs>

  <g clip-path="url(#wavePanel)">
    <rect width="1200" height="300" fill="url(#bgGrad)"/>

    <!-- Distant drifting grid -->
    <g opacity="0.12" stroke="#a78bfa" stroke-width="1">
      <g>
        <line x1="0" y1="60" x2="1200" y2="40"/>
        <line x1="0" y1="120" x2="1200" y2="100"/>
        <line x1="0" y1="180" x2="1200" y2="160"/>
        <line x1="0" y1="240" x2="1200" y2="220"/>
        <animateTransform attributeName="transform" type="translate"
          values="0 0; 20 0; 0 0" dur="18s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- Far big soft orbs -->
    <circle cx="150" cy="60" r="130" fill="url(#orbPurple)" filter="url(#blurBig)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 40 20; -20 -12; 0 0" dur="22s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="180" r="150" fill="url(#orbBlue)" filter="url(#blurBig)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; -35 -15; 25 12; 0 0" dur="26s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="230" r="110" fill="url(#orbPink)" filter="url(#blurBig)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 30 -15; -25 12; 0 0" dur="20s" repeatCount="indefinite"/>
    </circle>

    <!-- Nearer smaller orbs, faster float -->
    <circle cx="950" cy="45" r="50" fill="url(#orbPurple)" filter="url(#blurSmall)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; -20 12; 15 -8; 0 0" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="230" cy="200" r="42" fill="url(#orbPink)" filter="url(#blurSmall)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 18 -10; -14 8; 0 0" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="35" r="32" fill="url(#orbBlue)" filter="url(#blurSmall)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; -15 8; 12 -6; 0 0" dur="9s" repeatCount="indefinite"/>
    </circle>

    <!-- Twinkling stars -->
    <g fill="#ffffff">
      <circle cx="90" cy="40" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="1120" cy="90" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="1000" cy="250" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="60" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" begin="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="480" cy="240" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.8s" begin="0.8s" repeatCount="indefinite"/></circle>
      <circle cx="820" cy="200" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="1.8s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Name: fades and rises in slowly, then stays visible -->
    <g transform="translate(0,18)" opacity="0">
      <text x="600" y="95" text-anchor="middle" font-family="'Segoe UI', Poppins, Arial, sans-serif"
            font-size="54" font-weight="700" fill="url(#textGrad)">
        Shivani Shet
      </text>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.35;1" dur="3.5s" begin="0.3s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
        values="0 30; 0 30; 0 0" keyTimes="0;0.35;1" dur="3.5s" begin="0.3s" fill="freeze"/>
    </g>

    <!-- Quote, appears after name -->
    <g opacity="0">
      <text x="600" y="135" text-anchor="middle" font-family="'Segoe UI', Poppins, Arial, sans-serif"
            font-size="19" font-style="italic" fill="#c9b8ff">
        "Turning caffeine into code, one commit at a time."
      </text>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.6;1" dur="4.5s" begin="0.3s" fill="freeze"/>
    </g>
  </g>

  <!-- Subtle bulge/concave outline stroke on the panel edge for a raised, embossed feel -->
  <use href="#wavePanelShape" fill="none" stroke="#8A63FF" stroke-opacity="0.25" stroke-width="2"/>
</svg>
