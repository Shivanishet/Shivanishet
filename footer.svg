<svg width="900" height="170" viewBox="0 0 900 170" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bgGradF" cx="70%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#24243E">
        <animate attributeName="stop-color"
          values="#24243E;#302B63;#3b0764;#302B63;#24243E"
          dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0F0C29" />
      <animate attributeName="cx" values="80%;20%;70%;80%" dur="13s" repeatCount="indefinite" />
      <animate attributeName="cy" values="50%;20%;60%;50%" dur="15s" repeatCount="indefinite" />
    </radialGradient>

    <linearGradient id="shimmerF" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#8A63FF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="waveGradF" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F0C29" stop-opacity="0" />
      <stop offset="100%" stop-color="#0F0C29" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- animated dark background -->
  <rect width="900" height="170" fill="url(#bgGradF)" />

  <!-- diagonal shimmer sweep, opposite direction from header -->
  <rect x="900" y="0" width="300" height="170" fill="url(#shimmerF)" transform="skewX(-20)">
    <animateTransform attributeName="transform" type="translate"
      values="900 0; -1200 0" dur="7s" repeatCount="indefinite" additive="sum" />
  </rect>

  <!-- rising wave band at the top of the footer -->
  <path fill="url(#waveGradF)" opacity="0.7">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="
        M0,25 C150,45 300,10 450,25 C600,40 750,10 900,25 L900,0 L0,0 Z;
        M0,15 C150,0 300,35 450,15 C600,0 750,35 900,15 L900,0 L0,0 Z;
        M0,25 C150,45 300,10 450,25 C600,40 750,10 900,25 L900,0 L0,0 Z" />
  </path>

  <!-- drifting particles -->
  <g fill="#ffffff">
    <circle cx="100" cy="130" r="1.4" opacity="0.3">
      <animate attributeName="cy" values="130;30;130" dur="9s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="4.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="780" cy="50" r="1.3" opacity="0.25">
      <animate attributeName="cy" values="50;140;50" dur="10.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="450" cy="130" r="1.5" opacity="0.3">
      <animate attributeName="cy" values="130;20;130" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="40" r="1.1" opacity="0.2">
      <animate attributeName="cx" values="600;640;600" dur="9s" repeatCount="indefinite" />
      <animate attributeName="cy" values="40;120;40" dur="11s" repeatCount="indefinite" />
    </circle>
    <circle cx="250" cy="60" r="1.2" opacity="0.25">
      <animate attributeName="cy" values="60;140;60" dur="7.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- thanks message with stars, evenly balanced left/right of the centered text -->
  <text x="450" y="95" text-anchor="middle" font-family="'Segoe UI', Verdana, sans-serif"
        font-size="22" font-weight="600" fill="#e0e7ff">
    <tspan font-size="20" dx="0">⭐</tspan><tspan letter-spacing="1" dx="10">Thanks for visiting my profile!</tspan><tspan font-size="20" dx="10">⭐</tspan>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite" />
  </text>

  <!-- small tagline -->
  <text x="450" y="125" text-anchor="middle" font-family="'Segoe UI', Verdana, sans-serif"
        font-size="13" font-style="italic" fill="#a5b4fc" opacity="0">
    Let's build something great together
    <animate attributeName="opacity" from="0" to="1" begin="1s" dur="1.5s" fill="freeze" />
  </text>
</svg>
