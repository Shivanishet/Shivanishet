<svg width="1200" height="200" viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGradF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1a4a"/>
      <stop offset="55%" stop-color="#1a1030"/>
      <stop offset="100%" stop-color="#0b0718"/>
    </linearGradient>

    <radialGradient id="orbPurpleF" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8A63FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8A63FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbPinkF" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c15bff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#c15bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbBlueF" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5b9dff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#5b9dff" stop-opacity="0"/>
    </radialGradient>

    <filter id="blurBigF" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="blurSmallF" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <linearGradient id="textGradF" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d9c8ff"/>
    </linearGradient>

    <!-- Inward-curving top (scoops up into panel) / flat bottom -->
    <clipPath id="wavePanelF">
      <path d="M0,50 Q600,-30 1200,50 L1200,200 L0,200 Z"/>
    </clipPath>
    <path id="wavePanelShapeF" d="M0,50 Q600,-30 1200,50 L1200,200 L0,200 Z"/>
  </defs>

  <g clip-path="url(#wavePanelF)">
    <rect width="1200" height="200" fill="url(#bgGradF)"/>

    <!-- Distant drifting grid -->
    <g opacity="0.10" stroke="#a78bfa" stroke-width="1">
      <g>
        <line x1="0" y1="70" x2="1200" y2="85"/>
        <line x1="0" y1="120" x2="1200" y2="135"/>
        <line x1="0" y1="170" x2="1200" y2="155"/>
        <animateTransform attributeName="transform" type="translate"
          values="0 0; -20 0; 0 0" dur="16s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- Far soft orbs -->
    <circle cx="120" cy="150" r="100" fill="url(#orbPurpleF)" filter="url(#blurBigF)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 30 -15; -18 10; 0 0" dur="19s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="80" r="120" fill="url(#orbBlueF)" filter="url(#blurBigF)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; -28 15; 20 -12; 0 0" dur="23s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="60" r="85" fill="url(#orbPinkF)" filter="url(#blurBigF)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 22 12; -18 -8; 0 0" dur="17s" repeatCount="indefinite"/>
    </circle>

    <!-- Nearer smaller orbs -->
    <circle cx="900" cy="160" r="38" fill="url(#orbPurpleF)" filter="url(#blurSmallF)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; -16 8; 12 -6; 0 0" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="70" r="30" fill="url(#orbPinkF)" filter="url(#blurSmallF)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 14 8; -10 -6; 0 0" dur="9s" repeatCount="indefinite"/>
    </circle>

    <!-- Twinkling stars -->
    <g fill="#ffffff">
      <circle cx="130" cy="75" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="1090" cy="140" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.8s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle cx="980" cy="65" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" begin="1.1s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="155" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" begin="0.3s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Two gold stars flanking the message -->
    <g fill="#f5b342">
      <path transform="translate(450,105) scale(1.1)" d="M12 2l2.9 6.6L22 9.3l-5 4.9 1.2 7.1L12 17.8 5.8 21.3 7 14.2 2 9.3l7.1-0.7z">
        <animateTransform attributeName="transform" type="scale" additive="sum"
          values="1;1.15;1" dur="2.4s" repeatCount="indefinite"/>
      </path>
      <path transform="translate(730,105) scale(1.1)" d="M12 2l2.9 6.6L22 9.3l-5 4.9 1.2 7.1L12 17.8 5.8 21.3 7 14.2 2 9.3l7.1-0.7z">
        <animateTransform attributeName="transform" type="scale" additive="sum"
          values="1;1.15;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Message: fades and rises in slowly -->
    <g transform="translate(0,16)" opacity="0">
      <text x="600" y="135" text-anchor="middle" font-family="'Segoe UI', Poppins, Arial, sans-serif"
            font-size="30" font-weight="700" fill="url(#textGradF)">
        Thanks for visiting my profile!
      </text>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.3;1" dur="3s" begin="0.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate"
        values="0 26; 0 26; 0 0" keyTimes="0;0.3;1" dur="3s" begin="0.2s" fill="freeze"/>
    </g>

    <!-- Quote -->
    <g opacity="0">
      <text x="600" y="170" text-anchor="middle" font-family="'Segoe UI', Poppins, Arial, sans-serif"
            font-size="18" font-style="italic" fill="#c9b8ff">
        "Let's build something great together."
      </text>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.55;1" dur="4s" begin="0.2s" fill="freeze"/>
    </g>
  </g>

  <use href="#wavePanelShapeF" fill="none" stroke="#8A63FF" stroke-opacity="0.25" stroke-width="2"/>
</svg>
